services:
  amr_robot:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: amr_ros2_container
    stdin_open: true
    tty: true
    ports:
      - "8765:8765"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ../ros2_ws:/ros2_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash